# CONDUIT irrigation controller as a Nanvix guest.
# Synced into <nanvix>/src/user/irrigation-controller by bridge/conduit_bridge.py,
# together with ../ctl.rs and ../protocol.rs (copied byte-for-byte into src/).

[package]
name = "irrigation-controller"
version.workspace = true
license-file.workspace = true
edition = "2024"
authors.workspace = true
description = "Verus-verified irrigation controller (CONDUIT Lab)"
homepage.workspace = true

[[bin]]
name = "irrigation-controller"

[dependencies]
nvx = { workspace = true }
nvx-crt0 = { workspace = true, features = ["rust-main", "provides-allocator"] }
sysalloc = { workspace = true }
libc_string = { workspace = true }
sys = { workspace = true, features = ["kcall"] }
sysapi = { workspace = true }
syscall = { workspace = true, features = ["syscall"] }
vstd = { workspace = true }

[features]
default = ["panic"]
panic = ["nvx/panic", "syscall/panic", "nvx-crt0/panic"]
