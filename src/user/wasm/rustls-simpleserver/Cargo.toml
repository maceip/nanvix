[workspace]

[package]
name = "rustls-simpleserver"
version = "0.1.0"
edition = "2021"
publish = false
description = "rustls simpleserver compiled for wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `ring` does not implement its RNG on wasm32-unknown-unknown without a
# JavaScript getrandom backend. Use the pure-Rust provider instead.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "0.0.2-alpha"
getrandom = { version = "0.2.17", features = ["custom"] }

[patch.crates-io]
rustls-pki-types = { path = "vendor/rustls-pki-types" }
